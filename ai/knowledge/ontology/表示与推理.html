<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本体的写法与推理</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --panel: #181d27;
    --panel-2: #202736;
    --line: #31394a;
    --text: #e8edf5;
    --muted: #93a0b5;
    --blue: #9ecbff;
    --blue-dim: #1a334d;
    --amber: #f0c14a;
    --amber-dim: #3a3116;
    --red: #ffb0b0;
    --red-dim: #4a2428;
    --green: #9ad7b8;
    --green-dim: #173228;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  code, .mono, pre { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
  #app { max-width: 1080px; margin: 0 auto; padding: 28px 22px 64px; }
  h1 { font-size: 26px; line-height: 1.3; font-weight: 650; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 16px; margin: 0 0 8px; font-weight: 650; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 72ch; }
  .tabs { display: flex; gap: 6px; margin: 0 0 16px; flex-wrap: wrap; }
  .tabs button, .seg button, .syn button, .mini button, .step, .scene, .layer, .construct {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--muted);
  }
  .tabs button.on, .seg button.on, .syn button.on, .mini button.on,
  .step.on, .scene.on, .layer.on, .construct.on {
    background: var(--panel-2);
    color: var(--text);
    border-color: #4d5b73;
  }
  .walk { display: grid; grid-template-columns: 232px 1fr; gap: 16px; align-items: start; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .check {
    display: inline-flex; gap: 6px; align-items: center;
    color: var(--muted); font-size: 13px;
  }
  .ask { margin: 0 0 12px; }
  .ask b { font-weight: 650; }
  .stage { overflow-x: auto; padding-bottom: 4px; }
  .chain { display: flex; align-items: stretch; min-width: 820px; }
  .chain.order { min-width: 640px; flex-direction: column; gap: 10px; }
  .chain.order .line { display: flex; align-items: stretch; }
  .node {
    width: 156px; flex: 0 0 156px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
  }
  .node.hot { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .node.cold { opacity: 1; }
  .nm { font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .chips { display: flex; flex-direction: column; gap: 4px; }
  .chip {
    display: block;
    border-radius: 7px;
    padding: 3px 6px;
    font-size: 12px;
    line-height: 1.35;
  }
  .chip i { font-style: normal; font-family: ui-monospace, Menlo, monospace; opacity: 0.85; }
  .chip.asserted { background: var(--blue-dim); color: var(--blue); }
  .chip.inferred { background: var(--amber-dim); color: var(--amber); }
  .chip.conflict { background: var(--red-dim); color: var(--red); }
  .chip.fresh { outline: 1px solid currentColor; }
  .arr {
    width: 92px; flex: 0 0 92px;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; padding: 0 4px;
  }
  .arr .lbl { font-size: 11px; line-height: 1.3; color: var(--blue); }
  .arr.inferred .lbl { color: var(--amber); }
  .arr.off { opacity: 0.28; }
  .arr.fresh .lbl { font-weight: 650; }
  .shaft { width: 100%; height: 0; border-top: 1.5px solid currentColor; margin-top: 5px; position: relative; color: var(--muted); }
  .arr.inferred .shaft { color: var(--amber); }
  .arr.asserted .shaft { color: #5f87b3; }
  .shaft::after {
    content: "";
    position: absolute; right: -1px; top: -4px;
    border: 4px solid transparent;
    border-left: 6px solid currentColor;
  }
  .extra, .branch, .ghost, .note {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .extra.on, .branch .on { color: var(--amber); }
  .ghost {
    margin-top: 10px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    max-width: 280px;
  }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step { border-radius: 10px; text-align: left; padding: 8px 10px; }
  .step small { display: block; color: var(--muted); font-size: 12px; }
  .step.on small { color: var(--muted); }
  .nav { display: flex; gap: 8px; margin-top: 10px; }
  .nav button { border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); padding: 6px 10px; }
  .axiom { margin-top: 12px; }
  .axiom h2 { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  pre {
    margin: 8px 0 0;
    background: #0d1118;
    border-radius: 10px;
    padding: 12px 14px;
    overflow: auto;
    font-size: 12.5px;
    line-height: 1.5;
    color: #d7e0ec;
  }
  .why { margin: 8px 0 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 4px; }
  .dot.a { background: var(--blue); }
  .dot.i { background: var(--amber); }
  .dot.r { background: var(--red); }
  .split { display: grid; grid-template-columns: 200px 1fr; gap: 14px; }
  .construct, .scene, .layer { display: block; width: 100%; text-align: left; border-radius: 10px; margin-bottom: 6px; }
  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .card p, .detail p { margin: 0 0 8px; color: var(--muted); }
  .card p:last-child, .detail p:last-child { margin-bottom: 0; }
  .k { color: var(--text); }
  .profiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .profiles button {
    text-align: left;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 10px;
  }
  .profiles button.on { border-color: var(--amber); background: var(--panel-2); }
  .profiles b { display: block; margin-bottom: 4px; }
  .profiles span { color: var(--muted); font-size: 12px; }
  .scenes { display: flex; flex-wrap: wrap; gap: 6px; }
  .scene { width: auto; border-radius: 999px; }
  .answer {
    margin-top: 10px;
    background: var(--green-dim);
    color: var(--green);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .foot { margin-top: 22px; color: var(--muted); max-width: 78ch; }
  .foot p { margin: 0 0 8px; }
  .banner {
    background: var(--red-dim);
    color: var(--red);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  @media (max-width: 860px) {
    .walk { display: flex; flex-direction: column; }
    .maincol { order: -1; }
    .split, .cols3, .cols2, .profiles { grid-template-columns: 1fr; }
    .chain, .chain.order { min-width: 0; flex-direction: column; align-items: stretch; }
    .chain.order .line { flex-direction: column; align-items: stretch; }
    .node { width: auto; flex: 1 1 auto; }
    .arr { width: auto; flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 8px; padding: 2px 0 2px 8px; }
    .shaft { width: 28px; margin-top: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  tab: "walk",
  caseId: "trade",
  step: 4,
  contradict: false,
  openWorld: false,
  syn: "turtle",
  construct: "gci",
  profile: "RL",
  scene: "block",
};

const SYN_LABEL = { manchester: "Manchester", turtle: "Turtle", functional: "函数式" };

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

const tradeSteps = [
  {
    title: "源事实",
    sub: "没有结论",
    hot: ["A1042", "harbor", "acme", "globex", "sdn", "alice"],
    why: "股权、名单、人事、订单各写一条边。没有人写「受制裁」，也没有人写「阻断」。",
    axioms: [{
      name: "ABox · 个体断言",
      manchester: `Individual: tr:globex
    Facts: tr:listedOn tr:sdn

Individual: tr:acme
    Facts: tr:subsidiaryOf tr:globex

Individual: tr:harbor
    Facts: tr:subsidiaryOf tr:acme, tr:employs tr:alice

Individual: tr:A1042
    Types: tr:Shipment
    Facts: tr:consignedTo tr:harbor

Individual: tr:sdn
    Types: tr:SanctionList`,
      turtle: `tr:globex tr:listedOn tr:sdn .
tr:acme tr:subsidiaryOf tr:globex .
tr:harbor tr:subsidiaryOf tr:acme ;
    tr:employs tr:alice .
tr:A1042 a tr:Shipment ;
    tr:consignedTo tr:harbor .
tr:sdn a tr:SanctionList .`,
      functional: `ObjectPropertyAssertion( tr:listedOn tr:globex tr:sdn )
ObjectPropertyAssertion( tr:subsidiaryOf tr:acme tr:globex )
ObjectPropertyAssertion( tr:subsidiaryOf tr:harbor tr:acme )
ObjectPropertyAssertion( tr:employs tr:harbor tr:alice )
ClassAssertion( tr:Shipment tr:A1042 )
ObjectPropertyAssertion( tr:consignedTo tr:A1042 tr:harbor )
ClassAssertion( tr:SanctionList tr:sdn )`,
    }],
  },
  {
    title: "名单推出受制裁",
    sub: "Globex",
    hot: ["globex", "sdn"],
    why: "Globex 列在 SDN 上，SDN 是制裁名单。存在限制写在子类公理的左侧，所以 Globex 成为受制裁参与方。listedOn 的定义域再推出 Globex 是参与方。定义域是蕴含，不是拒收。",
    axioms: [{
      name: "列在制裁名单上 ⊑ 受制裁参与方",
      manchester: `SubClassOf: tr:listedOn some tr:SanctionList, tr:SanctionedParty`,
      turtle: `[
    a owl:Restriction ;
    owl:onProperty tr:listedOn ;
    owl:someValuesFrom tr:SanctionList
] rdfs:subClassOf tr:SanctionedParty .`,
      functional: `SubClassOf(
  ObjectSomeValuesFrom( tr:listedOn tr:SanctionList )
  tr:SanctionedParty
)`,
    }, {
      name: "listedOn 的定义域",
      manchester: `ObjectProperty: tr:listedOn
    Domain: tr:Party
    Range: tr:SanctionList`,
      turtle: `tr:listedOn a owl:ObjectProperty ;
    rdfs:domain tr:Party ;
    rdfs:range tr:SanctionList .`,
      functional: `ObjectPropertyDomain( tr:listedOn tr:Party )
ObjectPropertyRange( tr:listedOn tr:SanctionList )`,
    }],
  },
  {
    title: "定义域推出类型",
    sub: "组织、人、逆关系",
    hot: ["acme", "globex", "harbor", "alice"],
    why: "subsidiaryOf 的两端被推出为组织。Harbor 雇用 Alice，Alice 被推出为人。employs 与 employedBy 互逆，所以 Alice employedBy Harbor。组织、人再沿子类成为参与方。",
    axioms: [{
      name: "subsidiaryOf 的定义域和值域",
      manchester: `ObjectProperty: tr:subsidiaryOf
    Characteristics: Transitive
    Domain: tr:Organization
    Range: tr:Organization`,
      turtle: `tr:subsidiaryOf a owl:ObjectProperty, owl:TransitiveProperty ;
    rdfs:domain tr:Organization ;
    rdfs:range tr:Organization .`,
      functional: `TransitiveObjectProperty( tr:subsidiaryOf )
ObjectPropertyDomain( tr:subsidiaryOf tr:Organization )
ObjectPropertyRange( tr:subsidiaryOf tr:Organization )`,
    }, {
      name: "employs 的定义域、值域、逆属性",
      manchester: `ObjectProperty: tr:employs
    Domain: tr:Organization
    Range: tr:Person
    InverseOf: tr:employedBy`,
      turtle: `tr:employs a owl:ObjectProperty ;
    rdfs:domain tr:Organization ;
    rdfs:range tr:Person ;
    owl:inverseOf tr:employedBy .`,
      functional: `ObjectPropertyDomain( tr:employs tr:Organization )
ObjectPropertyRange( tr:employs tr:Person )
InverseObjectProperties( tr:employs tr:employedBy )`,
    }],
  },
  {
    title: "股权穿透",
    sub: "子公司仍受制裁",
    hot: ["harbor", "acme", "globex"],
    why: "subsidiaryOf 可传递。Harbor 的母公司的母公司是 Globex。受制裁参与方的子公司仍是受制裁参与方。Acme、Harbor 因此受制裁。",
    axioms: [{
      name: "传递",
      manchester: `ObjectProperty: tr:subsidiaryOf
    Characteristics: Transitive`,
      turtle: `tr:subsidiaryOf a owl:TransitiveProperty .`,
      functional: `TransitiveObjectProperty( tr:subsidiaryOf )`,
    }, {
      name: "受制裁参与方的子公司 ⊑ 受制裁参与方",
      manchester: `SubClassOf: tr:subsidiaryOf some tr:SanctionedParty, tr:SanctionedParty`,
      turtle: `[
    a owl:Restriction ;
    owl:onProperty tr:subsidiaryOf ;
    owl:someValuesFrom tr:SanctionedParty
] rdfs:subClassOf tr:SanctionedParty .`,
      functional: `SubClassOf(
  ObjectSomeValuesFrom( tr:subsidiaryOf tr:SanctionedParty )
  tr:SanctionedParty
)`,
    }],
  },
  {
    title: "阻断装运",
    sub: "A1042",
    hot: ["A1042", "harbor"],
    why: "订单 A1042 的收货方是 Harbor。Harbor 已经是受制裁参与方。所以 A1042 是阻断装运。这句话不是名单系统写的。",
    axioms: [{
      name: "收货方受制裁 ⊑ 阻断装运",
      manchester: `SubClassOf: tr:consignedTo some tr:SanctionedParty, tr:BlockedShipment`,
      turtle: `[
    a owl:Restriction ;
    owl:onProperty tr:consignedTo ;
    owl:someValuesFrom tr:SanctionedParty
] rdfs:subClassOf tr:BlockedShipment .`,
      functional: `SubClassOf(
  ObjectSomeValuesFrom( tr:consignedTo tr:SanctionedParty )
  tr:BlockedShipment
)`,
    }],
  },
];

const tradeConflict = {
  title: "人和组织冲突",
  sub: "闭合后报错",
  hot: ["harbor"],
  why: "再断言 Harbor 是人。定义域已经推出 Harbor 是组织。人和组织不相交。owlrl 在闭合之后报告冲突。类型三元组仍然留下。拒收要另做 SHACL 或 API。",
  axioms: [{
    name: "不相交",
    manchester: `DisjointClasses: tr:Person, tr:Organization`,
    turtle: `tr:Person owl:disjointWith tr:Organization .`,
    functional: `DisjointClasses( tr:Person tr:Organization )`,
  }, {
    name: "多出来的断言",
    manchester: `Individual: tr:harbor
    Types: tr:Person`,
    turtle: `tr:harbor a tr:Person .`,
    functional: `ClassAssertion( tr:Person tr:harbor )`,
  }],
};

const orderSteps = [
  {
    title: "当前停在哪",
    sub: "写上的状态",
    hot: ["A1042", "shipped", "B7", "cancelled"],
    why: "A1042 的当前状态是已发货。已发货属于已履约。B7 的当前状态是已取消。已取消属于付款前。mayProceedTo 十四条边是写进去的，这一步不推历史。",
    axioms: [{
      name: "两笔订单的当前状态",
      manchester: `Individual: od:shipped
    Types: od:Fulfilled

Individual: od:A1042
    Types: od:Order
    Facts: od:hasStatus od:shipped

Individual: od:cancelled
    Types: od:BeforePay

Individual: od:B7
    Types: od:Order
    Facts: od:hasStatus od:cancelled`,
      turtle: `od:shipped a od:Fulfilled .
od:A1042 a od:Order ; od:hasStatus od:shipped .
od:cancelled a od:BeforePay .
od:B7 a od:Order ; od:hasStatus od:cancelled .`,
      functional: `ClassAssertion( od:Fulfilled od:shipped )
ClassAssertion( od:Order od:A1042 )
ObjectPropertyAssertion( od:hasStatus od:A1042 od:shipped )
ClassAssertion( od:BeforePay od:cancelled )
ClassAssertion( od:Order od:B7 )
ObjectPropertyAssertion( od:hasStatus od:B7 od:cancelled )`,
    }],
  },
  {
    title: "状态个体抬到 Status",
    sub: "子类，加上值域",
    hot: ["shipped", "cancelled"],
    why: "已履约、付款前、已结束都是状态的子类。hasStatus 的值域也是状态。已发货、已取消因此是状态。已关闭没有订单停在上面，它只靠子类成为状态。",
    axioms: [{
      name: "阶段 ⊑ 状态",
      manchester: `Class: od:Fulfilled
    SubClassOf: od:Status

Class: od:BeforePay
    SubClassOf: od:Status

DisjointClasses: od:BeforePay, od:Fulfilled`,
      turtle: `od:Fulfilled rdfs:subClassOf od:Status .
od:BeforePay rdfs:subClassOf od:Status ;
    owl:disjointWith od:Fulfilled .`,
      functional: `SubClassOf( od:Fulfilled od:Status )
SubClassOf( od:BeforePay od:Status )
DisjointClasses( od:BeforePay od:Fulfilled )`,
    }, {
      name: "hasStatus 的值域",
      manchester: `ObjectProperty: od:hasStatus
    Characteristics: Functional
    Domain: od:Order
    Range: od:Status`,
      turtle: `od:hasStatus a owl:FunctionalProperty, owl:ObjectProperty ;
    rdfs:domain od:Order ;
    rdfs:range od:Status .`,
      functional: `FunctionalObjectProperty( od:hasStatus )
ObjectPropertyDomain( od:hasStatus od:Order )
ObjectPropertyRange( od:hasStatus od:Status )`,
    }],
  },
  {
    title: "阶段抬到订单",
    sub: "A1042 与 B7",
    hot: ["A1042", "shipped", "B7", "cancelled"],
    why: "当前状态落在已履约，订单就是已履约订单。A1042 因此是已履约订单。B7 因此是付款前的订单。没人直接写这两个类型。",
    axioms: [{
      name: "hasStatus some 已履约 ⊑ 已履约订单",
      manchester: `SubClassOf: od:hasStatus some od:Fulfilled, od:FulfilledOrder

SubClassOf: od:hasStatus some od:BeforePay, od:BeforePayOrder`,
      turtle: `[
    a owl:Restriction ;
    owl:onProperty od:hasStatus ;
    owl:someValuesFrom od:Fulfilled
] rdfs:subClassOf od:FulfilledOrder .

[
    a owl:Restriction ;
    owl:onProperty od:hasStatus ;
    owl:someValuesFrom od:BeforePay
] rdfs:subClassOf od:BeforePayOrder .`,
      functional: `SubClassOf(
  ObjectSomeValuesFrom( od:hasStatus od:Fulfilled )
  od:FulfilledOrder
)
SubClassOf(
  ObjectSomeValuesFrom( od:hasStatus od:BeforePay )
  od:BeforePayOrder
)`,
    }],
  },
  {
    title: "这次物化停在这里",
    sub: "历史不在图里",
    hot: ["A1042", "shipped"],
    why: "mayProceedTo 仍是写进去的边。推理器没有推出「走到已发货就一定付过款」。那条归纳在 Lean 的 funded_saw_paid。",
    axioms: [{
      name: "允许的边，不是历史定理",
      manchester: `ObjectProperty: od:mayProceedTo
    Domain: od:Status
    Range: od:Status

Individual: od:shipped
    Facts: od:mayProceedTo od:delivered`,
      turtle: `od:mayProceedTo a owl:ObjectProperty ;
    rdfs:domain od:Status ;
    rdfs:range od:Status .
od:shipped od:mayProceedTo od:delivered .`,
      functional: `ObjectPropertyDomain( od:mayProceedTo od:Status )
ObjectPropertyRange( od:mayProceedTo od:Status )
ObjectPropertyAssertion( od:mayProceedTo od:shipped od:delivered )`,
    }],
  },
];

const orderConflict = {
  title: "两个当前状态",
  sub: "函数性合并",
  hot: ["A1042", "shipped", "draft"],
  why: "再给 A1042 一个草稿状态。hasStatus 是函数性的，草稿和已发货被并成同一个体。付款前与已履约不相交。推理器报告不一致。",
  axioms: [{
    name: "函数性",
    manchester: `ObjectProperty: od:hasStatus
    Characteristics: Functional`,
    turtle: `od:hasStatus a owl:FunctionalProperty .`,
    functional: `FunctionalObjectProperty( od:hasStatus )`,
  }, {
    name: "多出来的断言",
    manchester: `Individual: od:A1042
    Facts: od:hasStatus od:draft

Individual: od:draft
    Types: od:BeforePay
    DifferentFrom: od:shipped`,
    turtle: `od:A1042 od:hasStatus od:draft .
od:draft a od:BeforePay ; owl:differentFrom od:shipped .`,
    functional: `ObjectPropertyAssertion( od:hasStatus od:A1042 od:draft )
ClassAssertion( od:BeforePay od:draft )
DifferentIndividuals( od:draft od:shipped )`,
  }],
};

const CASES = {
  trade: {
    name: "出口合规",
    ask: "收货方会不会沿股权被制裁名单穿透？",
    file: "出口合规/trade.ttl",
    script: "python3 reason.py",
    conclusion: "A1042 被推出为阻断装运。源系统没写这句话。",
    end: 4,
  },
  order: {
    name: "订单流转",
    ask: "当前状态落在哪一阶段，订单就算哪一类？",

  const base = caseId === "trade" ? tradeSteps : orderSteps;
  if (!state.contradict) return base;
  return base.concat([caseId === "trade" ? tradeConflict : orderConflict]);
}

function chipHtml(caseId, id) {
  const list = (chips[caseId][id] || []).filter((c) => {
    if (c.need === "contradict" && !state.contradict) return false;
    if (c.need === "contradict" && state.step < c.step) return false;
    return state.step >= c.step;
  });
  return list.map((c) => {
    const fresh = c.step === state.step ? " fresh" : "";
    return `<span class="chip ${c.kind}${fresh}">${esc(c.t)} <i>${esc(c.n)}</i></span>`;
  }).join("");
}

function nodeHtml(caseId, id, name, sub, hot) {
  const cls = hot ? "node hot" : "node cold";
  return `<div class="${cls}"><div class="nm">${esc(name)}</div><div class="sub">${esc(sub)}</div><div class="chips">${chipHtml(caseId, id)}</div></div>`;
}

function arrHtml(label, kind) {
  return `<div class="arr ${kind}"><div class="lbl">${esc(label)}</div><div class="shaft"></div></div>`;
}

    <h2 style="margin:16px 0 8px">点一个问题</h2>
    <div class="scenes">
      ${scenes.map((s) => `<button class="scene ${s.id === scene.id ? "on" : ""}" data-act="scene" data-id="${s.id}">${esc(s.q)}</button>`).join("")}
    </div>
    <div class="answer"><b>${esc(scene.tag)}</b> · ${esc(scene.a)}</div>
  `;
}

function render() {
  const meta = CASES[state.caseId];
  const steps = stepsOf(state.caseId);
  if (state.step > steps.length - 1) state.step = steps.length - 1;
  const body = state.tab === "syntax" ? renderSyntax() : state.tab === "reason" ? renderReason() : renderWalk();
  document.getElementById("app").innerHTML = `
    <h1>写下来的契约，推出没人写过的事实</h1>
    <p class="lead">${esc(meta.conclusion)} 页面把同一次物化按依赖拆开。三种写法是同一条公理。reason.py 读 Turtle。</p>
    <div class="tabs">
      <button data-act="tab" data-tab="walk" class="${state.tab === "walk" ? "on" : ""}">推出过程</button>
      <button data-act="tab" data-tab="syntax" class="${state.tab === "syntax" ? "on" : ""}">写法</button>
      <button data-act="tab" data-tab="reason" class="${state.tab === "reason" ? "on" : ""}">推理与场景</button>
    </div>
    ${body}
    <div class="foot">
      <p>换 Manchester、Turtle 或函数式语法，公理不变。owlrl 吃三元组，所以文件是 Turtle。文件后缀不带来推理。</p>
      <p>剖面是 OWL 2 RL。推理器一次前向链闭合，区分断言和推出。完整 DL 的 tableau 不在这两份脚本里。</p>
      <p>缺了就拒绝，用 SHACL。人要改状态并回写，用动作。未支付就不能发货，用 Lean。三件事都不是这两份本体在算的蕴含。</p>
    </div>
  `;
}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el || el.matches("input")) return;
  const act = el.dataset.act;
  if (act === "tab") state.tab = el.dataset.tab;
  if (act === "case") {
    state.caseId = el.dataset.case;
    state.step = CASES[state.caseId].end;
    state.contradict = false;
    state.openWorld = false;
  }
  if (act === "step") state.step = Number(el.dataset.step);
  if (act === "syn") state.syn = el.dataset.syn;
  if (act === "construct") state.construct = el.dataset.id;
  if (act === "layer") state.layer = el.dataset.layer;
  if (act === "profile") state.profile = el.dataset.id;
  if (act === "scene") {
    state.scene = el.dataset.id;
    const tag = (scenes.find((s) => s.id === state.scene) || {}).tag;
    if (profiles[tag]) state.profile = tag;
  }
  if (act === "prev") state.step = Math.max(0, state.step - 1);
  if (act === "next") state.step += 1;
  render();
});

document.addEventListener("change", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "contradict") {
    state.contradict = el.checked;
    if (state.contradict) state.step = stepsOf(state.caseId).length - 1;
  }
  if (el.dataset.act === "openworld") state.openWorld = el.checked;
  render();
});

render();
</script>
</body>
</html>
